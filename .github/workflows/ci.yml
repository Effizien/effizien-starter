# All four jobs below are REQUIRED STATUS CHECKS on `main`. A red run blocks the
# merge — this is a gate, not a report.
#
# It was report-only until 2026-08-17, because required checks need branch
# protection and GitHub refuses that on a private repository under a free plan.
# The repository is now public and the checks are enforced. ADR-005 records what
# changed and supersedes ADR-003.
#
# `enforce_admins` is deliberately off: a solo operator locked out of his own
# main branch mid-launch is a worse failure than a skipped check. That is the
# one remaining way past these jobs, and it is a deliberate escape hatch rather
# than a hole.

name: CI

# Every pull request, and every push to main. The push run is what makes the
# main branch's status meaningful — a PR can be green and main still break if
# two PRs merge in an order neither was tested in.
on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run irrelevant. Cancelling it
# frees a runner and stops a stale red cross sitting on a commit that has been
# superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Why these are `vars` and not `secrets` ───────────────────────────────────
#
# A Sanity project ID and dataset name are public by construction: they appear
# in every API request the browser makes, which is why they carry the
# `NEXT_PUBLIC_` prefix. `.env.example` and `.claude/rules/secrets.md` both say
# so. Putting them in `secrets` would suggest otherwise, and teaching a client
# that public identifiers are secrets is how the genuinely secret ones stop
# being treated differently.
#
# The read token is deliberately absent. Draft mode and Visual Editing are the
# only things that need it, neither is exercised here, and the app warns rather
# than failing when it is missing — see `src/sanity/lib/token.ts`.
#
# **A cloned site must set these two, or CI cannot build.** `src/sanity/env.ts`
# throws without them, on purpose: a site that silently builds against the wrong
# dataset is worse than one that refuses to build.
env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
  NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}

jobs:
  # The fast gate: typecheck → lint → unit tests → build. Under two minutes, and
  # the one most failures land in.
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    # Comfortably above the ~55s this job takes. Every job here carries one:
    # GitHub's default is six hours, which is how a stalled step went unnoticed
    # long enough to need cancelling by hand.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the project is not configured
        # Without this the failure surfaces three steps later as a stack trace
        # from inside the Next build, which reads as a code problem rather than
        # a settings one.
        run: |
          if [ -z "$NEXT_PUBLIC_SANITY_PROJECT_ID" ] || [ -z "$NEXT_PUBLIC_SANITY_DATASET" ]; then
            echo "::error::Set NEXT_PUBLIC_SANITY_PROJECT_ID and NEXT_PUBLIC_SANITY_DATASET as repository *variables* (Settings → Secrets and variables → Actions → Variables). Both are public by design; they are not secrets."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The schema only fully resolves when the Studio builds. `AGENTS.md` calls
  # this "the real check that the schema resolves" — a type error in a schema
  # file is caught by tsc, but an unresolved type name, a reference to a
  # document type that is not registered, or a broken archetype switch is not.
  studio:
    name: Studio build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm --dir studio install --frozen-lockfile
      - run: pnpm studio:build

  # WCAG 2.2 AA, automated half. Separate from `check` on purpose: it takes
  # minutes rather than seconds, and a lint failure hiding an accessibility
  # failure would mean fixing one, pushing, and discovering the other.
  accessibility:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the project is not configured
        run: |
          if [ -z "$NEXT_PUBLIC_SANITY_PROJECT_ID" ] || [ -z "$NEXT_PUBLIC_SANITY_DATASET" ]; then
            echo "::error::Set NEXT_PUBLIC_SANITY_PROJECT_ID and NEXT_PUBLIC_SANITY_DATASET as repository variables."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Keyed on the resolved Playwright version, so a version bump invalidates
      # the cache rather than running new tests against an old browser.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Browser only — no `--with-deps`, and no `install-deps` on the cached
      # path either. Both of those shell out to `apt-get`, and that call was the
      # least predictable thing in this pipeline: measured at 21s, 22s and 141s
      # on three consecutive green runs, then hung for over twenty minutes on a
      # fourth and had to be cancelled by hand. The tests it prepares take
      # thirty seconds.
      #
      # GitHub's `ubuntu-latest` image ships Chrome, Chromium, Edge and Firefox
      # preinstalled, so the shared libraries Playwright's bundled Chromium
      # needs are already present. Nothing here installs them.
      #
      # Runner images do change. If Chromium ever fails to launch, Playwright
      # says so in the first seconds with the exact `install-deps` command to
      # run — a fast, self-describing failure instead of a silent stall. Put the
      # apt call back if that happens, but put it on *both* paths and give it a
      # `timeout-minutes`: system packages are not cached, so a cache hit and a
      # cache miss need exactly the same libraries, and the old asymmetry only
      # ever meant the apt call ran on the common path rather than the rare one.
      - run: pnpm exec playwright install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      - run: pnpm test:a11y

      # The HTML report carries the axe violation detail and a screenshot of the
      # failing page. Only kept when something failed — on a green run it is
      # megabytes of nothing.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Core Web Vitals, against Google's published thresholds rather than against
  # whatever this site currently achieves. The reasoning, the TBT-stands-in-for-
  # INP substitution and the revisit triggers are in
  # `docs/decisions/ADR-004-core-web-vitals-budgets.md` — `lighthouserc.json` is
  # JSON and cannot carry any of it.
  performance:
    name: Core Web Vitals (Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the project is not configured
        run: |
          if [ -z "$NEXT_PUBLIC_SANITY_PROJECT_ID" ] || [ -z "$NEXT_PUBLIC_SANITY_DATASET" ]; then
            echo "::error::Set NEXT_PUBLIC_SANITY_PROJECT_ID and NEXT_PUBLIC_SANITY_DATASET as repository variables."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `lhci autorun` builds nothing — it starts a server against whatever is
      # already built, so the build has to happen first and explicitly.
      - run: pnpm build
      - run: pnpm exec lhci autorun

      # The HTML reports carry the trace and the filmstrip, which is most of
      # what makes a Core Web Vitals failure diagnosable rather than just red.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
