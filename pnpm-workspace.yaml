# pnpm settings.
#
# This is NOT a workspace. The `packages` field is deliberately omitted, so only
# the root package is included and studio/ stays an independent app with its own
# dependency tree — which is what D-011 (single repo, no monorepo tooling) and
# Sanity's own standalone-Studio guidance both call for.
#
# The file exists because pnpm 11 no longer reads the `pnpm` field in
# package.json; settings moved here.

# Exact versions on `pnpm add` — no caret ranges. `AGENTS.md` makes this a hard
# constraint: "Versions are pinned exactly and `.npmrc` sets `save-exact`. Do not
# introduce a caret range. Version drift between client sites is the problem this
# starter exists to prevent."
#
# `.npmrc` does still say `save-exact=true`, and pnpm 11 does not read it — the
# same migration this file's header describes for the `pnpm` field in
# package.json. `pnpm config get save-exact` returned `undefined` and
# `pnpm add -D vitest` wrote `^4.1.10`, so the constraint was stated in three
# places and enforced in none. Found during WP6 chunk 1, on the first `pnpm add`
# since the pnpm 11 upgrade — which is why nothing had drifted yet.
saveExact: true

# Refuse to install on a Node version outside `engines`, rather than warning.
#
# `.npmrc` says `engine-strict=true` and **pnpm 11 does not read it** — exactly the
# defect WP6 found with `save-exact` in the same file, missed then because only the
# setting that had just been tripped over was moved. `pnpm config get engine-strict`
# returned `undefined`, so the range in `package.json` was decorative: nothing enforced
# it and a build on the wrong major would simply proceed.
#
# With this here and `engines.node` pinned to a single major, the three places that name
# a Node version — `.nvmrc`, `engines`, and whatever Vercel picks — cannot disagree
# silently. A mismatch now fails the install with a message naming both versions.
engineStrict: true

# pnpm blocks postinstall scripts by default — a supply-chain protection, since a
# postinstall runs arbitrary code at install time. esbuild's is legitimate: it
# links the platform-specific binary, and the Next.js build fails without it.
# Approve deliberately, one package at a time; never blanket-allow.
allowBuilds:
  esbuild: true

# next-sanity declares `sanity` and `styled-components` as peers for its
# next-sanity/studio entry points. The Studio here is standalone, so the app
# never imports those, and pulling them in would put the entire Studio into the
# app's dependency tree — defeating the reason for splitting them.
peerDependencyRules:
  ignoreMissing:
    - sanity
    - styled-components
